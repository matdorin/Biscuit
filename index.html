<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐릭터챗</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;height:100dvh;display:flex;align-items:center;justify-content:center}
#app{display:flex;height:90dvh;max-height:700px;width:100%;max-width:860px;border:1px solid #e0e0e0;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
#sidebar{width:260px;min-width:260px;border-right:1px solid #efefef;display:flex;flex-direction:column;background:#fafafa}
#sidebar-header{padding:14px 16px;border-bottom:1px solid #efefef;display:flex;align-items:center;justify-content:space-between}
#sidebar-header span{font-size:15px;font-weight:600;color:#111}
#new-char-btn{background:none;border:1px solid #ddd;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;color:#555;display:flex;align-items:center;gap:4px}
#new-char-btn:hover{background:#f0f0f0}
#char-list{flex:1;overflow-y:auto;padding:8px}
.char-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.char-item:hover{background:#f0f0f0}
.char-item.active{background:#ededfd;border:1px solid #c9c6f0}
.char-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#eeedfe}
.char-info{flex:1;min-width:0}
.char-name{font-size:14px;font-weight:500;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-preview{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#api-section{padding:12px 16px;border-top:1px solid #efefef}
#api-section label{font-size:11px;color:#888;display:block;margin-bottom:4px}
#api-key-input{width:100%;font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#111}
#chat-area{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
#chat-header{padding:14px 20px;border-bottom:1px solid #efefef;display:flex;align-items:center;gap:12px}
#chat-header-avatar{width:36px;height:36px;border-radius:50%;background:#eeedfe;display:flex;align-items:center;justify-content:center;font-size:18px}
#chat-header-name{font-size:15px;font-weight:600;color:#111}
#chat-header-desc{font-size:12px;color:#888}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:80%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;color:#111;word-break:break-word}
.msg.ai .msg-bubble{background:#f3f3f3;border-radius:4px 16px 16px 16px}
.msg.user .msg-bubble{background:#534AB7;color:#fff;border-radius:16px 4px 16px 16px}
.msg-avatar{width:30px;height:30px;border-radius:50%;background:#eeedfe;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px}
#input-area{padding:16px 20px;border-top:1px solid #efefef;display:flex;gap:10px;align-items:flex-end}
#msg-input{flex:1;resize:none;padding:10px 14px;border-radius:20px;border:1px solid #ddd;background:#f9f9f9;color:#111;font-size:14px;line-height:1.5;max-height:120px;font-family:inherit;outline:none}
#msg-input:focus{border-color:#534AB7;background:#fff}
#send-btn{width:38px;height:38px;border-radius:50%;background:#534AB7;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:16px}
#send-btn:hover{background:#3C3489}
#send-btn:disabled{background:#ddd;color:#aaa;cursor:not-allowed}
#empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#aaa}
#empty-state i{font-size:40px}
#empty-state p{font-size:14px}
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:10;align-items:center;justify-content:center}
#modal-bg.open{display:flex}
#modal{background:#fff;border-radius:16px;padding:24px;width:340px;border:1px solid #eee;box-shadow:0 8px 32px rgba(0,0,0,0.12)}
#modal h3{font-size:16px;font-weight:600;margin-bottom:16px;color:#111}
.field{margin-bottom:14px}
.field label{font-size:12px;color:#888;display:block;margin-bottom:5px}
.field input,.field textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ddd;background:#fafafa;color:#111;font-size:14px;font-family:inherit;outline:none}
.field input:focus,.field textarea:focus{border-color:#534AB7;background:#fff}
.field textarea{resize:vertical;min-height:80px}
.emoji-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.emoji-opt{font-size:22px;cursor:pointer;padding:4px;border-radius:8px;border:2px solid transparent}
.emoji-opt.selected{border-color:#534AB7;background:#eeedfe}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.modal-btns button{padding:7px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
#modal-cancel{background:none;border:1px solid #ddd;color:#888}
#modal-cancel:hover{background:#f5f5f5}
#modal-save{background:#534AB7;border:none;color:#fff}
#modal-save:hover{background:#3C3489}
.typing{display:flex;gap:4px;align-items:center;padding:4px 0}
.typing span{width:7px;height:7px;background:#aaa;border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@media(max-width:600px){
  #app{height:100dvh;max-height:none;border-radius:0;border:none}
  #sidebar{width:220px;min-width:220px}
}
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <span>캐릭터챗</span>
      <button id="new-char-btn" onclick="openModal()"><i class="ti ti-plus"></i> 새 캐릭터</button>
    </div>
    <div id="char-list"></div>
    <div id="api-section">
      <label>Gemini API 키</label>
      <input id="api-key-input" type="password" placeholder="AIza..." oninput="saveApiKey(this.value)">
    </div>
  </div>

  <div id="chat-area">
    <div id="empty-state">
      <i class="ti ti-message-circle"></i>
      <p>캐릭터를 선택하거나 새로 만들어보세요</p>
    </div>
    <div id="chat-main" style="display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden">
      <div id="chat-header">
        <div id="chat-header-avatar"></div>
        <div>
          <div id="chat-header-name"></div>
          <div id="chat-header-desc"></div>
        </div>
      </div>
      <div id="messages"></div>
      <div id="input-area">
        <textarea id="msg-input" rows="1" placeholder="메시지를 입력하세요..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button id="send-btn" onclick="sendMessage()" aria-label="전송"><i class="ti ti-send"></i></button>
      </div>
    </div>
  </div>
</div>

<div id="modal-bg">
  <div id="modal">
    <h3>새 캐릭터 만들기</h3>
    <div class="field">
      <label>이름</label>
      <input id="f-name" placeholder="예: 아리, 제이크, 선생님...">
    </div>
    <div class="field">
      <label>아이콘</label>
      <div class="emoji-picker" id="emoji-picker"></div>
    </div>
    <div class="field">
      <label>한줄 소개</label>
      <input id="f-desc" placeholder="예: 츤데레 동급생">
    </div>
    <div class="field">
      <label>캐릭터 설정 (시스템 프롬프트)</label>
      <textarea id="f-prompt" placeholder="예: 너는 츤데레 성격의 고등학생이야. 겉으로는 차갑지만 속은 따뜻해. 반말로 대화해."></textarea>
    </div>
    <div class="modal-btns">
      <button id="modal-cancel" onclick="closeModal()">취소</button>
      <button id="modal-save" onclick="saveChar()">만들기</button>
    </div>
  </div>
</div>

<script>
const EMOJIS=['🧑','👧','👦','🧒','👩','👨','🧙','🧝','🧛','🧟','🤖','🦊','🐱','🐶','🐺','🦁','🐯','🐻','🐼','🐸','🦄','🐉'];
let chars=JSON.parse(localStorage.getItem('cc_chars')||'[]');
let chats=JSON.parse(localStorage.getItem('cc_chats')||'{}');
let apiKey=localStorage.getItem('cc_apikey')||'';
let activeId=null;
let selectedEmoji=EMOJIS[0];
let isLoading=false;

document.getElementById('api-key-input').value=apiKey;

const emojiPicker=document.getElementById('emoji-picker');
EMOJIS.forEach(e=>{
  const d=document.createElement('span');
  d.className='emoji-opt'+(e===selectedEmoji?' selected':'');
  d.textContent=e;
  d.onclick=()=>{
    selectedEmoji=e;
    document.querySelectorAll('.emoji-opt').forEach(x=>x.classList.remove('selected'));
    d.classList.add('selected');
  };
  emojiPicker.appendChild(d);
});

function saveApiKey(v){apiKey=v;localStorage.setItem('cc_apikey',v)}
function saveChars(){localStorage.setItem('cc_chars',JSON.stringify(chars))}
function saveChatsStore(){localStorage.setItem('cc_chats',JSON.stringify(chats))}

function renderList(){
  const el=document.getElementById('char-list');
  el.innerHTML='';
  if(!chars.length){
    el.innerHTML='<p style="font-size:13px;color:#aaa;text-align:center;padding:20px 12px">캐릭터가 없어요.<br>위 버튼으로 만들어보세요!</p>';
    return;
  }
  chars.forEach(c=>{
    const msgs=chats[c.id]||[];
    const last=msgs.length?msgs[msgs.length-1].content:'아직 대화 없음';
    const d=document.createElement('div');
    d.className='char-item'+(c.id===activeId?' active':'');
    d.innerHTML=`<div class="char-avatar">${c.emoji}</div><div class="char-info"><div class="char-name">${c.name}</div><div class="char-preview">${last.slice(0,30)}${last.length>30?'...':''}</div></div>`;
    d.onclick=()=>selectChar(c.id);
    el.appendChild(d);
  });
}

function selectChar(id){
  activeId=id;
  const c=chars.find(x=>x.id===id);
  if(!c)return;
  document.getElementById('empty-state').style.display='none';
  const cm=document.getElementById('chat-main');
  cm.style.display='flex';
  document.getElementById('chat-header-avatar').textContent=c.emoji;
  document.getElementById('chat-header-name').textContent=c.name;
  document.getElementById('chat-header-desc').textContent=c.desc||'';
  renderMessages();
  renderList();
  setTimeout(()=>{const m=document.getElementById('messages');m.scrollTop=m.scrollHeight},50);
}

function renderMessages(){
  const el=document.getElementById('messages');
  const msgs=chats[activeId]||[];
  el.innerHTML='';
  const c=chars.find(x=>x.id===activeId);
  msgs.forEach(m=>{
    const isUser=m.role==='user';
    const div=document.createElement('div');
    div.className='msg '+(isUser?'user':'ai');
    div.innerHTML=`${!isUser?`<div class="msg-avatar">${c.emoji}</div>`:''}<div class="msg-bubble">${m.content.replace(/\n/g,'<br>')}</div>`;
    el.appendChild(div);
  });
}

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}

async function sendMessage(){
  if(isLoading||!activeId)return;
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text)return;
  if(!apiKey){alert('좌측 하단에 Gemini API 키를 먼저 입력해주세요.');return;}

  const c=chars.find(x=>x.id===activeId);
  if(!chats[activeId])chats[activeId]=[];
  chats[activeId].push({role:'user',content:text});
  input.value='';
  input.style.height='auto';
  saveChatsStore();
  renderMessages();
  renderList();

  const msgs=document.getElementById('messages');
  const typing=document.createElement('div');
  typing.className='msg ai';
  typing.id='typing-indicator';
  const av=document.createElement('div');
  av.className='msg-avatar';
  av.textContent=c.emoji;
  const bubble=document.createElement('div');
  bubble.className='msg-bubble';
  bubble.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  typing.appendChild(av);
  typing.appendChild(bubble);
  msgs.appendChild(typing);
  msgs.scrollTop=msgs.scrollHeight;

  isLoading=true;
  document.getElementById('send-btn').disabled=true;

  try{
    const history=(chats[activeId]||[]).slice(0,-1).map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.content}]}));
    const body={
      system_instruction:{parts:[{text:c.prompt||`너는 ${c.name}이야. ${c.desc||''}`}]},
      contents:[...history,{role:'user',parts:[{text}]}],
      generationConfig:{maxOutputTokens:800,temperature:0.9}
    };
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
    });
    const data=await res.json();
    const reply=data?.candidates?.[0]?.content?.parts?.[0]?.text||'(응답 없음)';
    chats[activeId].push({role:'assistant',content:reply});
    saveChatsStore();
  }catch(e){
    chats[activeId].push({role:'assistant',content:'오류가 발생했어요. API 키를 확인해주세요.'});
    saveChatsStore();
  }

  isLoading=false;
  document.getElementById('send-btn').disabled=false;
  const t=document.getElementById('typing-indicator');
  if(t)t.remove();
  renderMessages();
  renderList();
  setTimeout(()=>{msgs.scrollTop=msgs.scrollHeight},50);
}

function openModal(){
  document.getElementById('f-name').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-prompt').value='';
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open')}
function saveChar(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert('이름을 입력해주세요');return;}
  const c={id:Date.now().toString(),name,emoji:selectedEmoji,desc:document.getElementById('f-desc').value.trim(),prompt:document.getElementById('f-prompt').value.trim()};
  chars.push(c);
  saveChars();
  closeModal();
  renderList();
  selectChar(c.id);
}

renderList();
</script>
</body>
</html>
